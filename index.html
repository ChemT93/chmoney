<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>우리집 가계부</title>
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e6e4df;--exp:#d9534f;--inc:#2f7d5b;--acc:#2f5d8a;--chip:#efede8}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f21;--ink:#f2f2f2;--sub:#a0a0a6;--line:#2e2e31;--exp:#ff7b72;--inc:#5fcf9a;--acc:#7fb0e0;--chip:#2a2a2d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:5;display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.mnav{display:flex;align-items:center;gap:6px}.mnav button{border:0;background:var(--chip);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:18px}
.mnav span{min-width:56px;text-align:center;font-weight:600}
main{padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:none;padding:10px;border-radius:8px;font-size:16px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px}
.amount input{flex:1;border:0;background:none;color:var(--ink);font-size:32px;font-weight:700;padding:6px 0;min-width:0;outline:none}
.amount span{color:var(--sub);font-size:18px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;height:74px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;white-space:nowrap;overflow:hidden}
.grid button .e{font-size:26px;line-height:1;height:30px;display:flex;align-items:center;justify-content:center}.grid button .e svg{display:block}
.grid button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.owners{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.owners button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:12px 0;font-size:15px;font-weight:600}
.owners button.on{background:var(--acc);border-color:var(--acc);color:#fff}
select{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;font-size:16px}
input[type=text],input[type=date],input[type=password]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px;font-size:16px}
.primary{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;color:#fff;background:var(--acc);margin-top:18px}
.primary:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat .k{font-size:12px;color:var(--sub)}.stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.sec{font-weight:700;margin-bottom:8px}
.sgw{padding:10px}
.sgscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}.sgscroll .sgrid{min-width:440px}
.sec2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.sec2 .sm{font-size:15px;font-variant-numeric:tabular-nums}.sec2 small{color:var(--sub);font-weight:400;font-size:12px}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 10px}.big small{font-size:15px;margin-left:2px;color:var(--sub);font-weight:600}
.pace{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.pace i{display:block;height:100%;background:var(--exp);border-radius:5px}
.vs{padding:8px 0}.vs1{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums;margin-bottom:5px}.vs1 small{font-size:11.5px}
.vt{position:relative;height:8px;border-radius:4px;background:var(--chip)}.vt i{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.vt i.p{background:var(--sub);opacity:.45}.vt i.c{background:var(--exp);opacity:.6;height:4px;top:2px}.vt i.c.over{opacity:1}
.zero{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5}
.hb{display:grid;grid-template-columns:minmax(0,96px) 1fr auto;gap:8px;align-items:center;font-size:13.5px;margin:7px 0;font-variant-numeric:tabular-nums}
.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ht i{display:block;height:9px;border-radius:5px;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:var(--chip);border-radius:10px;padding:10px}.tile .k{font-size:11.5px;color:var(--sub)}.tile .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile.main{grid-column:1/-1}.tile.main .v{font-size:20px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-bottom:8px}.stack i{display:block;height:100%}
.sv{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.sv:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%}.svn{font-size:14px;line-height:1.3}.svn small,.svv small{display:block;font-size:11.5px;color:var(--sub)}
.svv{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.3}
.sgrid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}
.sg{background:var(--card);padding:7px 6px;min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;line-height:1.25}
.sg.n{justify-content:flex-end;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.2px}
.sg.h{background:var(--chip);color:var(--sub);font-weight:600}
.sg.b{font-weight:700}.sg.blue{color:var(--acc)}.sg.red{color:var(--exp)}
.sg-gap{grid-column:1/-1;height:14px;background:var(--card)}
.meta{font-size:13px;color:var(--sub);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.meta b{color:var(--ink);font-weight:700}.meta b.exp{color:var(--exp)}.meta b.inc{color:var(--inc)}
details.cat{border-bottom:1px solid var(--line)}details.cat:last-child{border:0}
details.cat summary{list-style:none;display:grid;grid-template-columns:28px 64px 1fr auto;gap:8px;align-items:center;padding:9px 0;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
.ce{font-size:20px;text-align:center}.cn{font-size:14px;white-space:nowrap}
.cb i{display:block;height:9px;border-radius:5px;background:var(--exp);opacity:.8}
.cv{text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}.cv b{display:block;font-size:14px}.cv small,.mini small{color:var(--sub);font-size:11.5px}
details.cat[open] summary{color:var(--acc)}
.mini{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;font-variant-numeric:tabular-nums}
details.cat .mini{padding:5px 0 5px 36px;color:var(--sub)}details.cat .mini:last-child{padding-bottom:10px}
.rank{display:inline-block;width:20px;color:var(--sub)}
.bar{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--exp);opacity:.8}
.bar b{font-weight:600;font-variant-numeric:tabular-nums}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item .t{font-weight:600}.item .s{font-size:13px;color:var(--sub)}
.item .a{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.item .del{border:0;background:none;color:var(--sub);font-size:13px;padding:2px 0}
.day{font-size:13px;color:var(--sub);margin:14px 0 2px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s}
.row:last-child{border:0}.row .main{flex:1;min-width:0}.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .s{font-size:13px;color:var(--sub)}
.row .a{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.acts{display:flex;justify-content:flex-end;gap:2px;margin-top:2px}.acts button{border:0;background:none;color:var(--sub);font-size:13px;padding:4px 6px}.acts .ed{color:var(--acc)}
.ck{display:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;align-items:center;justify-content:center;font-size:13px;color:#fff}
.selmode .ck{display:flex}.selmode .acts{display:none}
.row.on{background:color-mix(in srgb,var(--acc) 14%,transparent);margin:0 -16px;padding-left:16px;padding-right:16px}.row.on .ck{background:var(--acc);border-color:var(--acc)}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:-4px 0 10px}
#selbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;padding:8px 10px}
#selbar .sb-t{flex:1;display:flex;flex-direction:column;line-height:1.2}#selbar small{color:var(--sub);font-size:12px}
#selbar button{border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;background:var(--chip);color:var(--ink)}
#selbar .sb-x{background:none;font-size:18px;padding:6px 8px}#selbar .sb-del{background:var(--exp);color:#fff}
#bs{position:fixed;inset:0;z-index:40}
.bs-back{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
.bs-panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.bs-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.bs-title{font-size:18px;font-weight:700;margin:0 0 4px}.bs-sub{color:var(--sub);font-size:14px;margin:0 0 12px}
.bs-list{background:var(--chip);border-radius:12px;padding:4px 12px;margin-bottom:6px}.bs-list .mini{font-size:14px}
.bs-btns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:14px}.bs-btns button{border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700}
.bs-btns .no{background:var(--chip);color:var(--ink)}.bs-btns .yes{background:var(--acc);color:#fff}.bs-btns .danger{background:var(--exp);color:#fff}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
nav{z-index:10;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--sub);padding:10px 0 12px;font-size:12px}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--acc);font-weight:700}
.hd-r{display:flex;align-items:center;gap:8px}
.gear{border:0;background:var(--chip);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:17px}
.keybox p{color:var(--sub);font-size:14px;margin:0 0 10px}
.ghost{width:100%;border:1px solid var(--line);background:none;color:var(--ink);border-radius:12px;padding:13px;font-size:15px;margin-top:10px}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#splash img{width:96px;height:96px;border-radius:22px;margin-bottom:16px}
#splash h2{margin:0 0 6px;font-size:22px}
#spMsg{color:var(--sub);font-size:14px;margin:0 0 18px;min-height:20px;white-space:pre-line}
#spMsg.bad{color:var(--exp)}
#spForm{width:100%;max-width:320px}
#spForm input{text-align:center;font-size:18px;letter-spacing:1px}
.toast{z-index:45;position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.muted{color:var(--sub);font-size:14px;text-align:center;padding:24px 0}
svg text{fill:var(--sub);font-size:11px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <h2>우리집 가계부</h2>
  <p id="spMsg">불러오는 중…</p>
  <form id="spForm" hidden onsubmit="spSubmit();return false">
    <input type="password" id="spKey" placeholder="비밀 키" autocomplete="current-password" enterkeyhint="go">
    <button class="primary" type="submit">시작하기</button>
  </form>
</div>
<header><h1 id="title">가계부</h1><div class="hd-r"><div class="mnav" id="mnav" hidden><button onclick="moveMonth(-1)">‹</button><span id="mlabel"></span><button onclick="moveMonth(1)">›</button></div><button class="gear" id="gear" onclick="showKey(true)" aria-label="설정">⚙</button></div></header>
<main>
  <section id="v-key" hidden>
    <div class="card keybox">
      <p>키가 바뀌었을 때만 새 키를 입력하세요. 확인되면 이 휴대폰에서는 다시 묻지 않아요.</p>
      <input type="password" id="keyIn" placeholder="비밀 키" autocomplete="off">
      <button class="primary" onclick="saveKey()">새 키로 바꾸기</button>
      <button class="ghost" id="keyCancel" onclick="hideKey()">닫기</button>
      <button class="ghost" id="keyClear" onclick="clearKey()">이 휴대폰에서 키 지우기</button>
    </div>
  </section>
  <section id="v-err" hidden>
    <div class="card keybox">
      <p id="errMsg"></p>
      <button class="primary" onclick="boot()">다시 시도</button>
      <button class="ghost" onclick="showKey(true)">비밀 키 다시 입력</button>
    </div>
  </section>
  <section id="v-add">
    <div class="card">
      <div class="seg"><button id="k-expense" class="on" onclick="setKind('expense')">지출</button><button id="k-income" onclick="setKind('income')">수입</button></div>
      <div class="amount"><input id="amt" inputmode="numeric" placeholder="0" autocomplete="off"><span>원</span></div>
      <label>분류</label><div class="grid" id="cats"></div>
      <div id="subWrap" hidden><label>세부 항목</label><div class="chips" id="subs"></div></div>
      <div id="payWrap"><label id="payLabel">결제수단</label><div class="owners" id="owners"></div><select id="paySel" hidden></select></div>
      <label>내용</label><input type="text" id="memo" placeholder="예: 마트 장보기">
      <label>날짜</label><input type="date" id="date">
      <button class="primary" id="save" onclick="save()">저장</button>
    </div>
  </section>
  <section id="v-sum" hidden></section>
  <section id="v-list" hidden></section>
  <section id="v-year" hidden></section>
</main>
<nav>
  <button class="on" data-v="add" onclick="go('add')"><b>＋</b>입력</button>
  <button data-v="sum" onclick="go('sum')"><b>◔</b>이번 달</button>
  <button data-v="list" onclick="go('list')"><b>≡</b>내역</button>
  <button data-v="year" onclick="go('year')"><b>▥</b>연간</button>
</nav>
<div id="selbar" hidden><button class="sb-x" onclick="exitSel()" aria-label="선택 취소">✕</button><div class="sb-t"><b id="selN">0개 선택</b><small id="selSum"></small></div><button class="sb-all" onclick="selAll()">전체</button><button class="sb-del" onclick="askDelete([...S.sel])">삭제</button></div>
<div id="bs" hidden><div class="bs-back" onclick="closeSheet()"></div><div class="bs-panel" role="dialog" aria-modal="true"><div class="bs-grab"></div><div id="bsBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const S={kind:'expense',cat:'',sub:'',pay:'',boot:null,month:null,cache:{},view:'add'};
const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
// 시트와 연결된 Apps Script 웹앱 주소 (비밀 아님)
const API_URL='https://script.google.com/macros/s/AKfycbxVXgVjSk4pI38qvW91FZpjVl_2chnvCW8dcju7XnmQO1gZiw1anB0pjxWcnce8tGJ0/exec';
const apiUrl=()=>API_URL.startsWith('https://')?API_URL:(store.get('api')||'');
async function call(fn,...args){
  const key=store.get('key');
  if(!key){const e=new Error('비밀 키를 입력해 주세요');e.auth=true;throw e}
  if(!apiUrl())throw new Error('서버 주소가 아직 설정되지 않았어요');
  let res;
  try{res=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key,fn,args})})}
  catch(e){throw new Error('서버에 연결하지 못했어요. 인터넷 연결과, Apps Script 배포 설정(실행: 나 / 액세스: 모든 사용자)을 확인해 주세요.')}
  let j;try{j=await res.json()}catch(e){throw new Error('서버 응답을 읽지 못했어요. Apps Script를 새 버전으로 다시 배포했는지 확인해 주세요.')}
  if(j.code===401){const e=new Error(j.error);e.auth=true;throw e}
  if(!j.ok)throw new Error(j.error||'오류가 났어요');
  return j.data;
}
// 설치 링크(#key=…)로 열면 키를 저장하고 주소창에서 지움
function takeHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  const got=!!(p.get('key')||p.get('api'));
  if(p.get('key'))store.set('key',p.get('key'));
  if(p.get('api'))store.set('api',p.get('api'));
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  return got;
}
takeHash();
addEventListener('hashchange',()=>{if(takeHash()){store.del('ok');$('v-key').hidden=true;boot()}});
// 시작 화면: 확인된 키가 있으면 로고만 잠깐, 없으면 키 입력
function splashLoading(){$('splash').hidden=false;$('spForm').hidden=true;$('spMsg').className='';$('spMsg').textContent='불러오는 중…'}
function splashAsk(msg,bad){
  $('splash').hidden=false;$('spForm').hidden=false;
  $('spMsg').className=bad?'bad':'';$('spMsg').textContent=msg||'처음 한 번만 비밀 키를 입력해 주세요.\n확인되면 이 휴대폰에서는 다시 묻지 않아요.';

async function getSummary(m){const k='s'+m;return S.cache[k]||(S.cache[k]=await call('getSummary',m))}
// 시트 왼쪽 요약표를 보이는 그대로 (칸 합치기·머리글 색·굵게·▲▼ 색 반영)
const lum=hex=>{const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 1;const n=parseInt(m[1],16);return((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255};

        if(n){const x=parseInt(n[1],16),R=x>>16&255,G=x>>8&255,B=x&255;if(B>150&&R<100&&G<100)cls=' blue';else if(R>150&&G<100&&B<100)cls=' red'}
        html+=`<div class="sg${shade?' h':''}${g.bold[r][c]?' b':''}${num?' n':''}${cls}" style="grid-column:${c+1}/span ${sp[1]}${sp[0]>1?`;grid-row:span ${sp[0]}`:''}">${esc(txt)}</div>`;
      });

// ---- 요약(시각화): 시트 요약표 값을 읽어 그래프로 ----
const numOf=s=>{s=String(s||'').trim();if(!s||s==='-')return 0;const n=Number(s.replace(/[^\d.]/g,''));if(isNaN(n))return 0;return /^-\s*\d/.test(s)?-n:n};
const nz=s=>String(s||'').replace(/\s+/g,'');
function parseSummary(g){
  const R=g.rows.map(r=>r.map(v=>String(v).trim()));
  const find=t=>{for(let r=0;r<R.length;r++){const c=R[r].findIndex(x=>nz(x)===t);if(c>=0)return[r,c]}return null};
  const out={};
  // 고정/유동지출: 항목 | 전월 | 지출 | 증감
  out.groups=['고정지출','유동지출'].map(name=>{
    const p=find(name);if(!p)return null;const items=[];let total=null;
    for(let i=p[0]+1;i<R.length;i++){const row=R[i],k=nz(row[0]);
      if(k==='항목')continue;if(k==='합계'){total={prev:numOf(row[1]),cur:numOf(row[2])};break}
      if(!k||k==='고정지출'||k==='유동지출')break;
      items.push({name:row[0],prev:numOf(row[1]),cur:numOf(row[2])})}
    return{name,items,total:total||{prev:items.reduce((s,x)=>s+x.prev,0),cur:items.reduce((s,x)=>s+x.cur,0)}};
  }).filter(Boolean);
  const t=find('총합계');if(t)out.grand={prev:numOf(R[t[0]][t[1]+1]),cur:numOf(R[t[0]][t[1]+2])};
  // 항목별수입 | 지출구분
  const pi=find('항목별수입');
  if(pi){const qc=R[pi[0]].findIndex(x=>nz(x)==='지출구분');out.income=[];out.pay=[];
    for(let i=pi[0]+1;i<R.length;i++){const row=R[i];const L=nz(row[pi[1]]),Rt=qc>=0?nz(row[qc]):'';
      if(!L&&!Rt&&!row.some(Boolean))break;
      if(L==='합계'){out.incomeTotal=numOf(row[pi[1]+1]);if(qc>=0)out.payTotal=numOf(row[qc+1]);break}
      if(L)out.income.push({name:row[pi[1]],v:numOf(row[pi[1]+1])});
      if(Rt&&Rt!=='합계')out.pay.push({name:row[qc],v:numOf(row[qc+1])})}}
  // 잔액 블록
  const pb=find('잔액');
  if(pb){out.bal=[];for(let i=pb[0];i<R.length;i++){const row=R[i];if(!row[0])break;
    out.bal.push({name:row[0],v:numOf(row[1]),extra:row.slice(2).filter(x=>/\d/.test(x))})}}
  // 저축현황: 은행 | 잔고 | 만기 | 비고
  const ps=find('은행');
  if(ps){out.sav=[];for(let i=ps[0]+1;i<R.length;i++){const row=R[i];const k=nz(row[0]);
    if(k==='합계'){out.savTotal=numOf(row[1]);break}if(!k)break;
    out.sav.push({name:row[0],v:numOf(row[1]),due:row[2]||'',note:row[3]||''})}
    if(out.savTotal==null)out.savTotal=out.sav.reduce((s,x)=>s+x.v,0)}
  return out;
}
function hbars(list,color){
  const show=list.filter(x=>x.v),zero=list.filter(x=>!x.v),max=Math.max(1,...show.map(x=>x.v));
  return show.sort((a,b)=>b.v-a.v).map(x=>`<div class="hb"><span class="hn">${esc(x.name)}</span><span class="ht"><i style="width:${Math.max(2,x.v/max*100)}%;background:${color}"></i></span><b>${won(x.v)}</b></div>`).join('')
    +(zero.length?`<div class="zero">0원 · ${zero.map(x=>esc(x.name)).join(', ')}</div>`:'')
    +(!show.length&&!zero.length?'<div class="muted">내용 없음</div>':'');
}
async function renderVisual(el){

        <div class="vt"><i class="p" style="width:${x.prev/max*100}%"></i><i class="c${x.cur>x.prev?' over':''}" style="width:${Math.max(x.cur?1.5:0,x.cur/max*100)}%"></i></div></div>`}).join('')}
      ${zero.length?`<div class="zero">0원 · ${zero.map(x=>esc(x.name)).join(', ')}</div>`:''}
      <div class="legend"><span><i style="background:var(--sub);opacity:.45"></i>전월</span><span><i style="background:var(--exp)"></i>이번 달</span></div></div>`});
    // 수입 / 지출구분
    if(s.income)html+=`<div class="card"><div class="sec sec2"><span>항목별 수입</span><span class="sm inc">${won(s.incomeTotal??s.income.reduce((a,x)=>a+x.v,0))}</span></div>${hbars(s.income,'var(--inc)')}</div>`;
    if(s.pay)html+=`<div class="card"><div class="sec sec2"><span>지출 구분</span><span class="sm exp">${won(s.payTotal??s.pay.reduce((a,x)=>a+x.v,0))}</span></div>${hbars(s.pay,'var(--acc)')}</div>`;
    // 잔액
    if(s.bal&&s.bal.length)html+=`<div class="card"><div class="sec">잔액</div><div class="tiles">${s.bal.map((x,i)=>`<div class="tile${i===0?' main':''}"><div class="k">${esc(x.name)}</div><div class="v${x.v<0?' exp':''}">${won(x.v)}</div>${x.extra.length?`<div class="k">${x.extra.map(esc).join(' · ')}</div>`:''}</div>`).join('')}</div></div>`;
    // 저축현황
    if(s.sav&&s.sav.length){
      const list=[...s.sav].sort((a,b)=>b.v-a.v),tot=Math.max(1,s.savTotal),col=i=>`hsl(${(205+i*360/list.length)%360} 48% 56%)`;
      html+=`<div class="card"><div class="sec">저축 현황</div><div class="big">${won(s.savTotal)}<small>원</small></div>
      <div class="stack">${list.filter(x=>x.v>0).map((x,i)=>`<i style="width:${x.v/tot*100}%;background:${col(i)}"></i>`).join('')}</div>
      ${list.map((x,i)=>`<div class="sv"><span class="dot" style="background:${x.v>0?col(i):'var(--line)'}"></span><div class="svn">${esc(x.name)}${x.due||x.note?`<small>${esc([x.due&&('만기 '+x.due),x.note].filter(Boolean).join(' · '))}</small>`:''}</div><div class="svv"><b>${x.v?won(x.v):'-'}</b>${x.v?`<small>${(x.v/tot*100).toFixed(1)}%</small>`:''}</div></div>`).join('')}</div>`;
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML=`<div class="muted">${esc(e.message)}</div>`}
}

    html+=`<div class="card">${sec('분류별 지출')}${cats.map(([k,v])=>{
      const list=exps.filter(e=>(e.cat||'미분류')===k).sort((a,b)=>b.amount-a.amount);
      return `<details class="cat"><summary><span class="ce">${EMOJI[k]||'🏷️'}</span><span class="cn">${esc(k)}</span><span class="cb"><i style="width:${Math.max(3,v/max*100)}%"></i></span><span class="cv"><b>${won(v)}</b><small>${Math.round(v/d.expense*100)}% · ${list.length}건</small></span></summary>
        ${list.map(e=>`<div class="mini"><span>${e.date?Number(e.date.slice(8))+'일 ':''}${esc(e.memo||e.sub||'-')}</span><span>${won(e.amount)}</span></div>`).join('')}</details>`}).join('')||'<div class="muted">아직 지출이 없어요</div>'}</div>`;
    // 4. 날짜별
    const byDay=Array(dim+1).fill(0);exps.forEach(e=>{if(e.date)byDay[Number(e.date.slice(8))]+=e.amount});
    const dmax=Math.max(1,...byDay),W=340,H=110,step=W/dim,bw=Math.max(3,step-3);
    html+=`<div class="card">${sec('날짜별 지출')}<svg viewBox="0 0 ${W} ${H+16}" width="100%" role="img" aria-label="날짜별 지출 막대">
      ${byDay.slice(1).map((v,i)=>{const bh=v?Math.max(2,v/dmax*H):0;const today=isCur&&i+1===days;
        return `<rect x="${i*step+1}" y="${H-bh}" width="${bw}" height="${bh}" rx="1.5" fill="${today?'var(--acc)':'var(--exp)'}" opacity="${today?1:.75}"><title>${i+1}일 ${won(v)}원</title></rect>`}).join('')}
      ${[1,5,10,15,20,25,dim].map(x=>`<text x="${(x-1)*step+bw/2+1}" y="${H+13}" text-anchor="middle">${x}</text>`).join('')}</svg>
      <div class="meta">가장 많이 쓴 날: ${byDay.indexOf(dmax)>0?`${byDay.indexOf(dmax)}일 · <b>${won(dmax)}원</b>`:'-'}</div></div>`;
    // 5. 큰 지출
    const top=[...exps].sort((a,b)=>b.amount-a.amount).slice(0,5);
    if(top.length)html+=`<div class="card">${sec('큰 지출 TOP 5')}${top.map((e,i)=>`<div class="mini"><span><b class="rank">${i+1}</b>${esc(e.memo||e.cat)} <small>${esc(e.cat)}${e.date?' · '+Number(e.date.slice(8))+'일':''}</small></span><span class="exp"><b>${won(e.amount)}</b></span></div>`).join('')}</div>`;
    // 6. 수입 구성
    if(incs.length){
      const ic={};incs.forEach(e=>{const k=e.cat||'기타';ic[k]=(ic[k]||0)+e.amount});
      html+=`<div class="card">${sec('수입 구성')}${Object.entries(ic).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="mini"><span>${EMOJI[k]||'🏷️'} ${esc(k)}</span><span class="inc"><b>${won(v)}</b> <small>${Math.round(v/d.income*100)}%</small></span></div>`).join('')}</div>`;
    }
    el.innerHTML=html;
  }catch(e){el.innerHTML=`<div class="muted">${esc(e.message)}</div>`}
}
// ---------- 내역: 수정 · 삭제 · 길게 눌러 여러 개 선택 ----------
S.sel=new Set();S.selMode=false;
const entryLine=e=>`<div class="mini"><span>${e.date?Number(e.date.slice(8))+'일 ':''}${esc(e.memo||e.cat||'-')}</span><span class="${e.kind==='income'?'inc':'exp'}">${e.kind==='income'?'+':'−'}${won(e.amount)}</span></div>`;
async function renderList(){
  const el=$('v-list');el.innerHTML='<div class="muted">불러오는 중…</div>';
  try{
    const d=await loadMonth(S.month);S.listData=d;
    if(!d.entries.length){exitSel();el.innerHTML='<div class="card muted">내역이 없어요</div>';return}
    let html=`<div class="hint">길게 누르면 여러 개를 선택할 수 있어요</div><div class="card${S.selMode?' selmode':''}" id="listCard">`,last=null;
    d.entries.forEach((e,i)=>{
      if(e.date!==last){last=e.date;html+=`<div class="day">${e.date?Number(e.date.slice(5,7))+'월 '+Number(e.date.slice(8))+'일':'날짜 없음'}</div>`}
      html+=`<div class="row${S.sel.has(i)?' on':''}" data-i="${i}"><span class="ck">${S.sel.has(i)?'✓':''}</span>
        <div class="main"><div class="t">${esc(e.memo||e.cat||'(내용 없음)')}</div><div class="s">${esc([e.cat,e.sub,e.pay].filter(Boolean).join(' · '))}</div></div>
        <div class="a"><div class="${e.kind==='income'?'inc':'exp'}">${e.kind==='income'?'+':'−'}${won(e.amount)}</div>
        <div class="acts"><button class="ed" data-act="edit">수정</button><button data-act="del">삭제</button></div></div></div>`;
    });
    el.innerHTML=html+'</div>';
    el.querySelectorAll('.row').forEach(row=>{
      const i=Number(row.dataset.i);let timer=null,sx=0,sy=0,fired=false;
      const cancel=()=>{clearTimeout(timer);timer=null};
      row.addEventListener('pointerdown',ev=>{fired=false;sx=ev.clientX;sy=ev.clientY;cancel();
        timer=setTimeout(()=>{fired=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
          if(!S.selMode){S.selMode=true;S.sel=new Set([i])}else toggleSel(i,true);updateSel()},450)});
      row.addEventListener('pointermove',ev=>{if(timer&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10)cancel()});
      ['pointerup','pointercancel','pointerleave'].forEach(t=>row.addEventListener(t,cancel));
      row.addEventListener('contextmenu',ev=>ev.preventDefault());
      row.addEventListener('click',ev=>{
        if(fired){fired=false;return}
        const act=ev.target.closest('[data-act]');
        if(S.selMode){toggleSel(i);updateSel();return}
        if(act&&act.dataset.act==='edit')openEdit(d.entries[i]);
        else if(act&&act.dataset.act==='del')askDelete([i]);
      });
    });
    updateSel();
  }catch(e){el.innerHTML=`<div class="muted">${esc(e.message)}</div>`}
}
function toggleSel(i,on){if(on===true||!S.sel.has(i))S.sel.add(i);else S.sel.delete(i);if(!S.sel.size)S.selMode=false}
function updateSel(){
  const card=$('listCard');if(card)card.classList.toggle('selmode',S.selMode);
  document.querySelectorAll('#v-list .row').forEach(r=>{const on=S.sel.has(Number(r.dataset.i));r.classList.toggle('on',on);r.querySelector('.ck').textContent=on?'✓':''});
  $('selbar').hidden=!(S.selMode&&S.view==='list');
  if(S.selMode&&S.listData){const es=[...S.sel].map(i=>S.listData.entries[i]);
    const ex=es.filter(e=>e.kind==='expense').reduce((s,e)=>s+e.amount,0),inc=es.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0);
    $('selN').textContent=S.sel.size+'개 선택';$('selSum').textContent=[ex?'지출 '+won(ex):'',inc?'수입 '+won(inc):''].filter(Boolean).join(' · ')}
}
function selAll(){const n=S.listData.entries.length;S.sel=S.sel.size===n?new Set():new Set([...Array(n).keys()]);S.selMode=S.sel.size>0;updateSel()}
function exitSel(){S.selMode=false;S.sel=new Set();updateSel()}

// 바텀시트
function openSheet(html){$('bsBody').innerHTML=html;$('bs').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){$('bs').hidden=true;$('bsBody').innerHTML='';document.body.style.overflow=''}

// 삭제 확인
function askDelete(idx){
  const es=idx.map(i=>S.listData.entries[i]);if(!es.length)return;
  const show=es.slice(0,5),more=es.length-show.length;
  openSheet(`<div class="bs-title">${es.length===1?'이 내역을 삭제할까요?':es.length+'건을 삭제할까요?'}</div>
    <div class="bs-sub">시트에서도 지워지고 되돌릴 수 없어요.</div>
    <div class="bs-list">${show.map(entryLine).join('')}${more?`<div class="mini"><span>외 ${more}건</span><span></span></div>`:''}</div>
    <div class="bs-btns"><button class="no" onclick="closeSheet()">취소</button><button class="danger" id="bsYes">${es.length===1?'삭제':es.length+'건 삭제'}</button></div>`);
  $('bsYes').onclick=async()=>{
    const b=$('bsYes');b.disabled=true;b.textContent='삭제 중…';
    try{const r=await call('deleteEntries',es.map(e=>({id:e.id,amount:e.amount})));closeSheet();exitSel();toast(`${r.count}건 삭제했어요`);S.cache={};await loadMonth(S.month,true);renderList()}
    catch(err){b.disabled=false;b.textContent='다시 시도';toast(err.message)}
  };
}

// 수정 바텀시트 (입력 화면과 같은 구성)
let E=null;
function openEdit(e){
  E={orig:e,kind:e.kind,cat:e.cat,sub:e.sub,pay:e.pay,owner:e.pay?ownerOf(e.pay):''};
  openSheet(`<div class="bs-title">내역 수정</div>
    <div class="seg" style="margin-top:10px"><button id="ed-k-expense">지출</button><button id="ed-k-income">수입</button></div>
    <div class="amount"><input id="ed-amt" inputmode="numeric" value="${won(e.amount)}" autocomplete="off"><span>원</span></div>
    <label>분류</label><div class="grid" id="ed-cats"></div>
    <div id="ed-subWrap" hidden><label>세부 항목</label><div class="chips" id="ed-subs"></div></div>
    <div id="ed-payWrap"><label id="ed-payLabel">결제수단</label><div class="owners" id="ed-owners"></div><select id="ed-paySel" hidden></select></div>
    <label>내용</label><input type="text" id="ed-memo" value="${esc(e.memo)}">
    <label>날짜</label><input type="date" id="ed-date" value="${e.date||today()}">
    <div class="bs-btns"><button class="no" onclick="closeSheet()">취소</button><button class="yes" id="ed-save">저장</button></div>`);
  $('ed-k-expense').onclick=()=>{if(E.kind!=='expense'){E.kind='expense';E.cat='';E.sub='';E.pay='';E.owner='';renderEdit()}};
  $('ed-k-income').onclick=()=>{if(E.kind!=='income'){E.kind='income';E.cat='';E.sub='';E.pay='';E.owner='';renderEdit()}};
  $('ed-amt').addEventListener('input',ev=>{const n=ev.target.value.replace(/[^\d]/g,'');ev.target.value=n?Number(n).toLocaleString('ko-KR'):''});
  $('ed-save').onclick=saveEdit;
  renderEdit();
}
const withCur=(list,v)=>v&&!list.includes(v)?[v,...list]:list;   // 목록에 없는 예전 값도 보이게
function renderEdit(){
  $('ed-k-expense').classList.toggle('on',E.kind==='expense');$('ed-k-income').classList.toggle('on',E.kind==='income');
  tiles($('ed-cats'),withCur(S.boot.cats[E.kind]||[],E.cat),E.cat,v=>{E.cat=v;E.sub='';renderEdit()});
  const subs=withCur(S.boot.subs[E.cat]||[],E.sub);$('ed-subWrap').hidden=!subs.length;
  chips($('ed-subs'),subs,E.sub,v=>{E.sub=v;renderEdit()});
  renderEditPay();
}
function renderEditPay(open){
  const pays=withCur(S.boot.pays[E.kind]||[],E.pay);
  $('ed-payWrap').hidden=!pays.length;$('ed-payLabel').textContent=E.kind==='income'?'받은 곳':'결제수단';
  const owners=[...new Set(pays.map(ownerOf))],ob=$('ed-owners');
  ob.innerHTML=owners.map(o=>`<button class="${o===E.owner?'on':''}">${esc(o)}</button>`).join('');
  [...ob.children].forEach((btn,i)=>btn.onclick=()=>{const o=owners[i];if(o===E.owner)return;E.owner=o;
    const mine=pays.filter(p=>ownerOf(p)===o);E.pay=mine.length===1?mine[0]:'';renderEditPay(!E.pay)});
  const sel=$('ed-paySel'),mine=pays.filter(p=>ownerOf(p)===E.owner);sel.hidden=!E.owner;
  sel.innerHTML=(E.pay?'':'<option value="">선택하세요</option>')+mine.map(p=>`<option value="${esc(p)}"${p===E.pay?' selected':''}>${esc(methodOf(p))}</option>`).join('');
  sel.onchange=()=>{E.pay=sel.value;renderEditPay()};
  if(open&&!sel.hidden){sel.focus();try{sel.showPicker()}catch(_){}}
}
async function saveEdit(){
  const amount=Number($('ed-amt').value.replace(/[^\d]/g,''));
  if(!amount){toast('금액을 입력해 주세요');return}
  if(!E.cat){toast('분류를 골라 주세요');return}
  const o=E.orig,date=$('ed-date').value||o.date;
  const ne={kind:E.kind,amount,cat:E.cat,sub:E.sub,memo:$('ed-memo').value.trim(),pay:E.pay,date};
  const b=$('ed-save');b.disabled=true;b.textContent='저장 중…';
  try{
    const r=await call('updateEntry',o.id,o.amount,ne);
    closeSheet();S.cache={};
    toast(r.moved?`${r.sheet}(으)로 옮겨 저장했어요`:'수정했어요');
    await loadMonth(S.month,true);renderList();
  }catch(err){b.disabled=false;b.textContent='저장';toast(err.message)}
}
async function renderYear(){
  const el=$('v-year');el.innerHTML='<div class="muted">불러오는 중… (12개월 계산)</div>';
  try{
    const y=S.cache.year||(S.cache.year=await call('getYear'));
    const max=Math.max(1,...y.map(m=>Math.max(m.income,m.expense)));
    const W=340,H=180,bw=10,step=W/12;
    const bars=y.map((m,i)=>{const x=i*step+4;const hi=m.income/max*(H-24),he=m.expense/max*(H-24);
      return `<rect x="${x}" y="${H-20-hi}" width="${bw}" height="${hi}" rx="2" fill="var(--inc)"/><rect x="${x+bw+1}" y="${H-20-he}" width="${bw}" height="${he}" rx="2" fill="var(--exp)"/><text x="${x+bw}" y="${H-4}" text-anchor="middle">${m.month}</text>`}).join('');
    const ti=y.reduce((s,m)=>s+m.income,0),te=y.reduce((s,m)=>s+m.expense,0);
    el.innerHTML=`<div class="card"><div class="stats">
      <div class="stat"><div class="k">총수입</div><div class="v inc">${won(ti)}</div></div>
      <div class="stat"><div class="k">총지출</div><div class="v exp">${won(te)}</div></div>
      <div class="stat"><div class="k">총잔액</div><div class="v">${won(ti-te)}</div></div></div></div>
      <div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>
      <div class="legend"><span><i style="background:var(--inc)"></i>수입</span><span><i style="background:var(--exp)"></i>지출</span></div></div>
      <div class="card">${y.map(m=>`<div class="item"><div class="t">${m.month}월</div><div class="a"><span class="inc">${won(m.income)}</span> / <span class="exp">${won(m.expense)}</span></div></div>`).join('')}</div>`;
  }catch(e){el.innerHTML=`<div class="muted">${esc(e.message)}</div>`}
}

function showErr(msg){
  ['add','sum','list','year','key'].forEach(x=>$('v-'+x).hidden=true);
  $('v-err').hidden=false;$('mnav').hidden=true;$('title').textContent='연결 안 됨';$('errMsg').textContent=msg;
}
async function boot(){
  $('date').value=today();$('v-err').hidden=true;
  if(!store.get('key')){splashAsk();return}
  splashLoading();
  try{
    S.boot=await call('getBootstrap');
    store.set('ok','1');                       // 이 기기는 확인됨 → 키가 바뀌기 전까지 다시 묻지 않음
    if(!S.boot.ok){toast('월별 탭을 찾지 못했어요');}
    S.month=S.boot.currentMonth;
    setKind('expense');
    $('splash').hidden=true;
    go('add');
  }catch(e){
    S.err=e.message||'불러오기 실패';
    if(e.auth){const was=store.get('ok');store.del('key');store.del('ok');splashAsk(was?'비밀 키가 바뀌었어요. 새 키를 입력해 주세요.':S.err,true);return}
    if(store.get('ok')){$('splash').hidden=true;showErr(S.err);return}   // 확인된 기기: 키는 묻지 않고 연결 문제만 안내
    splashAsk(S.err,true);
  }
}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
